<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Project Form</title>
</head>

<body class="bg-gray-50 py-10">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Create New Project</h2>

        <form id="projectForm" class="space-y-5">
            <div>
                <label for="title" class="block text-sm font-semibold text-gray-700">Project Title *</label>
                <input type="text" id="title" name="title" required
                    class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="e.g. Portfolio Website">
            </div>

            <div>
                <label for="type" class="block text-sm font-semibold text-gray-700">Type *</label>
                <input type="text" id="type" name="type" required
                    class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="e.g. Fullstack, UI/UX">
            </div>

            <div>
                <label for="description" class="block text-sm font-semibold text-gray-700">Description *</label>
                <textarea id="description" name="description" rows="4" required
                    class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="What does this project do?"></textarea>
            </div>

            <div>
                <label for="tech" class="block text-sm font-semibold text-gray-700">Technologies (comma
                    separated)</label>
                <input type="text" id="tech" name="tech"
                    class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="React, Tailwind, Node.js">
            </div>

            <div>
                <label for="link" class="block text-sm font-semibold text-gray-700">Project URL</label>
                <input type="url" id="link" name="link"
                    class="mt-1 block w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="https://example.com">
            </div>

            <div>
                <label for="image" class="block text-sm font-semibold text-gray-700">Upload Project Image *</label>
                <input type="file" id="image" name="image" accept="image/*" required
                    class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md shadow-lg transition-all transform active:scale-95">
                Publish Project
            </button>
        </form>
    </div>

    <script>
        document.getElementById('projectForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    // 1. Create FormData directly from the form element
    const formData = new FormData(this);

    try {
        // 2. Send the request
        const response = await fetch('https://your-vercel-url.vercel.app/api/projects', {
            method: 'POST',
            body: formData // No Headers needed; fetch sets boundaries automatically for FormData
        });

        const result = await response.json();
        
        if (result.success) {
            alert('Project Published Successfully!');
            this.reset();
        } else {
            alert('Error: ' + result.error);
        }
    } catch (error) {
        console.error('Upload failed:', error);
        alert('Network error or Server is down.');
    }
});
    </script>

</body>

</html>
